metadata:
  recipe_type: ptq
  description: >-
    NVFP4 W4A4 with MSE calibration + FP8 scale sweep, FP8 KV cache.
    Static weight scales optimized to minimize quantization MSE, dynamic input
    scales. Mirrors NVFP4_W4A4_WEIGHT_MSE_FP8_SWEEP_CFG from config.py.
    Excludes linear_attn.in_proj_a/b ([32, 2048] — fails MARLIN tile_n_size=64),
    matching the safe-linattn variant. Deployable as full-quantized checkpoint.
quantize:
  algorithm:
    method: mse
    fp8_scale_sweep: true
  quant_cfg:
    - quantizer_name: '*'
      enable: false
    # Static NVFP4 weights — MSE picks scale per block to minimize quant error.
    - quantizer_name: '*weight_quantizer'
      enable: true
      cfg:
        num_bits: e2m1
        block_sizes:
          -1: 16
          type: static
          scale_bits: e4m3
    # Dynamic NVFP4 inputs — runtime block scaling.
    - quantizer_name: '*input_quantizer'
      enable: true
      cfg:
        num_bits: e2m1
        block_sizes:
          -1: 16
          type: dynamic
          scale_bits: e4m3
    # FP8 KV cache.
    - quantizer_name: '*[kv]_bmm_quantizer'
      enable: true
      cfg:
        num_bits: e4m3
    # Standard exclusions.
    - quantizer_name: '*block_sparse_moe.gate*'
      enable: false
    - quantizer_name: '*linear_attn.conv1d*'
      enable: false
    - quantizer_name: '*linear_attn.in_proj_a*'   # MARLIN tile alignment
      enable: false
    - quantizer_name: '*linear_attn.in_proj_b*'
      enable: false
    - quantizer_name: '*lm_head*'
      enable: false
    - quantizer_name: '*mixer.conv1d*'
      enable: false
    - quantizer_name: '*mlp.gate.*'
      enable: false
    - quantizer_name: '*mlp.shared_expert_gate.*'
      enable: false
    - quantizer_name: '*output_layer*'
      enable: false
    - quantizer_name: '*proj_out.*'
      enable: false
    - quantizer_name: '*router*'
      enable: false
    - quantizer_name: 'output.*'
      enable: false
    - parent_class: 'nn.BatchNorm1d'
      quantizer_name: '*'
      enable: false
    - parent_class: 'nn.BatchNorm2d'
      quantizer_name: '*'
      enable: false
    - parent_class: 'nn.BatchNorm3d'
      quantizer_name: '*'
      enable: false
    - parent_class: 'nn.LeakyReLU'
      quantizer_name: '*'
      enable: false
