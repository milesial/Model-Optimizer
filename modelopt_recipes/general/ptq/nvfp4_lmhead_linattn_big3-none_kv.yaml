metadata:
  recipe_type: ptq
  description: >
    Isolation recipe for Qwen3.6 hybrid GDN: NVFP4 lm_head plus NVFP4
    linear_attn big projections only. The ModelOpt export is converted to
    compressed-tensors W4A16 for inference, so activation quantizers are used
    only to make a standard NVFP4 export and are dropped by the CT converter.
    All routed experts, shared experts, self-attn, linear_attn.in_proj_a/b,
    convs, routers, VLM, MTP, and KV cache stay unquantized.
quantize:
  algorithm:
    method: max
    layerwise: false
  quant_cfg:
    - quantizer_name: '*'
      enable: false

    # lm_head: top-level in HF export, mapped to language_model.lm_head by vLLM.
    - quantizer_name: '*lm_head*weight_quantizer'
      enable: true
      cfg:
        block_sizes:
          -1: 16
          type: dynamic
          scale_bits: e4m3
        num_bits: e2m1
    - quantizer_name: '*lm_head*input_quantizer'
      enable: true
      cfg:
        block_sizes:
          -1: 16
          type: dynamic
          scale_bits: e4m3
        num_bits: e2m1

    # vLLM fuses these into linear_attn.in_proj_qkvz. Both shards must share
    # the same scheme, and out_proj is the other large GDN matrix.
    - quantizer_name: '*linear_attn.in_proj_qkv*weight_quantizer'
      enable: true
      cfg:
        block_sizes:
          -1: 16
          type: dynamic
          scale_bits: e4m3
        num_bits: e2m1
    - quantizer_name: '*linear_attn.in_proj_qkv*input_quantizer'
      enable: true
      cfg:
        block_sizes:
          -1: 16
          type: dynamic
          scale_bits: e4m3
        num_bits: e2m1
    - quantizer_name: '*linear_attn.in_proj_z*weight_quantizer'
      enable: true
      cfg:
        block_sizes:
          -1: 16
          type: dynamic
          scale_bits: e4m3
        num_bits: e2m1
    - quantizer_name: '*linear_attn.in_proj_z*input_quantizer'
      enable: true
      cfg:
        block_sizes:
          -1: 16
          type: dynamic
          scale_bits: e4m3
        num_bits: e2m1
    - quantizer_name: '*linear_attn.out_proj*weight_quantizer'
      enable: true
      cfg:
        block_sizes:
          -1: 16
          type: dynamic
          scale_bits: e4m3
        num_bits: e2m1
    - quantizer_name: '*linear_attn.out_proj*input_quantizer'
      enable: true
      cfg:
        block_sizes:
          -1: 16
          type: dynamic
          scale_bits: e4m3
        num_bits: e2m1

    # Explicit non-targets. The first wildcard already disables these, but
    # keeping them listed makes the recipe audit obvious.
    - quantizer_name: '*mlp.experts*'
      enable: false
    - quantizer_name: '*block_sparse_moe*'
      enable: false
    - quantizer_name: '*mlp.shared_expert*'
      enable: false
    - quantizer_name: '*mlp.shared_expert_gate*'
      enable: false
    - quantizer_name: '*self_attn*'
      enable: false
    - quantizer_name: '*linear_attn.conv1d*'
      enable: false
    - quantizer_name: '*linear_attn.in_proj_a*'
      enable: false
    - quantizer_name: '*linear_attn.in_proj_b*'
      enable: false
    - quantizer_name: '*mixer.conv1d*'
      enable: false
    - quantizer_name: '*mlp.gate.*'
      enable: false
    - quantizer_name: '*router*'
      enable: false
    - quantizer_name: '*visual*'
      enable: false
    - quantizer_name: '*vision_tower*'
      enable: false
    - quantizer_name: '*mtp*'
      enable: false
    - quantizer_name: '*[kv]_bmm_quantizer'
      enable: false
    - quantizer_name: '*output_layer*'
      enable: false
    - quantizer_name: '*proj_out.*'
      enable: false
    - quantizer_name: 'output.*'
      enable: false
    - parent_class: 'nn.BatchNorm1d'
      quantizer_name: '*'
      enable: false
    - parent_class: 'nn.BatchNorm2d'
      quantizer_name: '*'
      enable: false
    - parent_class: 'nn.BatchNorm3d'
      quantizer_name: '*'
      enable: false
    - parent_class: 'nn.LeakyReLU'
      quantizer_name: '*'
      enable: false
