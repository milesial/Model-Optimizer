metadata:
  recipe_type: ptq
  description: >-
    NVFP4 W4A4 + FP8 KV cache, max calibration. Like nvfp4_default-fp8_kv.yaml
    but excludes linear_attn.in_proj_a/b whose [32, 2048] output dim fails
    MARLIN's tile_n_size=64 constraint (and even at TP=1, 32 < 64). Those two
    modules stay BF16 (~7.5 MB total across 30 layers — negligible), which is
    what makes a full-NVFP4 checkpoint actually deployable on vLLM.
quantize:
  algorithm: max
  quant_cfg:
    - quantizer_name: '*'
      enable: false
    - quantizer_name: '*weight_quantizer'
      enable: true
      cfg:
        block_sizes:
          -1: 16
          type: dynamic
          scale_bits: e4m3
        num_bits: e2m1
    - quantizer_name: '*input_quantizer'
      enable: true
      cfg:
        block_sizes:
          -1: 16
          type: dynamic
          scale_bits: e4m3
        num_bits: e2m1
    - quantizer_name: '*[kv]_bmm_quantizer'
      enable: true
      cfg:
        num_bits: e4m3
        # Skip data-driven KV calibration: pin amax to the FP8 E4M3 max (448).
        # Calibrated K/V amax tend to be small (~13-17), causing saturation of
        # long-context attention values at inference; constant amax keeps the
        # full FP8 dynamic range, which is what vLLM/SGLang actually use.
        use_constant_amax: true
    - quantizer_name: '*block_sparse_moe.gate*'
      enable: false
    - quantizer_name: '*linear_attn.conv1d*'
      enable: false
    - quantizer_name: '*linear_attn.in_proj_a*'
      enable: false
    - quantizer_name: '*linear_attn.in_proj_b*'
      enable: false
    - quantizer_name: '*lm_head*'
      enable: false
    - quantizer_name: '*mixer.conv1d*'
      enable: false
    - quantizer_name: '*mlp.gate.*'
      enable: false
    - quantizer_name: '*mlp.shared_expert_gate.*'
      enable: false
    - quantizer_name: '*output_layer*'
      enable: false
    - quantizer_name: '*proj_out.*'
      enable: false
    - quantizer_name: '*router*'
      enable: false
    - quantizer_name: 'output.*'
      enable: false
    - parent_class: 'nn.BatchNorm1d'
      quantizer_name: '*'
      enable: false
    - parent_class: 'nn.BatchNorm2d'
      quantizer_name: '*'
      enable: false
    - parent_class: 'nn.BatchNorm3d'
      quantizer_name: '*'
      enable: false
    - parent_class: 'nn.LeakyReLU'
      quantizer_name: '*'
      enable: false
