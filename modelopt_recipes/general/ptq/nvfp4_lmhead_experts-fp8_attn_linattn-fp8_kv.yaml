metadata:
  recipe_type: ptq
  description: >
    NVFP4 lm_head + NVFP4 routed experts (W4A4) + FP8 self_attn (W8A8) +
    FP8 linear_attn big projections (in_proj_qkv/z, out_proj) + FP8 KV cache.
    linear_attn.in_proj_a / in_proj_b stay BF16 (output dim 32 — too narrow
    for stable per-block scales, sensitivity-critical for GDN dt/A).
quantize:
  algorithm:
    method: max
    layerwise: false
  quant_cfg:
    # ---------- global default: disable everything ----------
    - quantizer_name: '*'
      enable: false

    # ---------- NVFP4 (W4A4): routed experts ----------
    - quantizer_name: '*mlp.experts*weight_quantizer'
      enable: true
      cfg:
        block_sizes:
          -1: 16
          type: dynamic
          scale_bits: e4m3
        num_bits: e2m1
    - quantizer_name: '*mlp.experts*input_quantizer'
      enable: true
      cfg:
        block_sizes:
          -1: 16
          type: dynamic
          scale_bits: e4m3
        num_bits: e2m1
    - quantizer_name: '*block_sparse_moe*weight_quantizer'
      enable: true
      cfg:
        block_sizes:
          -1: 16
          type: dynamic
          scale_bits: e4m3
        num_bits: e2m1
    - quantizer_name: '*block_sparse_moe*input_quantizer'
      enable: true
      cfg:
        block_sizes:
          -1: 16
          type: dynamic
          scale_bits: e4m3
        num_bits: e2m1

    # ---------- NVFP4 (W4A4): lm_head logits projection ----------
    - quantizer_name: '*lm_head*weight_quantizer'
      enable: true
      cfg:
        block_sizes:
          -1: 16
          type: dynamic
          scale_bits: e4m3
        num_bits: e2m1
    - quantizer_name: '*lm_head*input_quantizer'
      enable: true
      cfg:
        block_sizes:
          -1: 16
          type: dynamic
          scale_bits: e4m3
        num_bits: e2m1

    # ---------- FP8 (W8A8): self_attn (q/k/v/o) ----------
    - quantizer_name: '*self_attn*weight_quantizer'
      enable: true
      cfg:
        num_bits: e4m3
        axis:
    - quantizer_name: '*self_attn*input_quantizer'
      enable: true
      cfg:
        num_bits: e4m3
        axis:

    # ---------- FP8 (W8A8): linear_attn big three (skip in_proj_a/b) ----------
    - quantizer_name: '*linear_attn.in_proj_qkv*weight_quantizer'
      enable: true
      cfg:
        num_bits: e4m3
        axis:
    - quantizer_name: '*linear_attn.in_proj_qkv*input_quantizer'
      enable: true
      cfg:
        num_bits: e4m3
        axis:
    - quantizer_name: '*linear_attn.in_proj_z*weight_quantizer'
      enable: true
      cfg:
        num_bits: e4m3
        axis:
    - quantizer_name: '*linear_attn.in_proj_z*input_quantizer'
      enable: true
      cfg:
        num_bits: e4m3
        axis:
    - quantizer_name: '*linear_attn.out_proj*weight_quantizer'
      enable: true
      cfg:
        num_bits: e4m3
        axis:
    - quantizer_name: '*linear_attn.out_proj*input_quantizer'
      enable: true
      cfg:
        num_bits: e4m3
        axis:

    # ---------- FP8 KV cache (cast scheme) ----------
    - quantizer_name: '*[kv]_bmm_quantizer'
      enable: true
      cfg:
        num_bits: e4m3

    # ---------- explicit excludes (BF16) ----------
    - quantizer_name: '*linear_attn.conv1d*'
      enable: false
    - quantizer_name: '*linear_attn.in_proj_a*'
      enable: false
    - quantizer_name: '*linear_attn.in_proj_b*'
      enable: false
    - quantizer_name: '*mlp.gate.*'
      enable: false
    - quantizer_name: '*mlp.shared_expert_gate.*'
      enable: false
    - quantizer_name: '*router*'
      enable: false
    - quantizer_name: '*block_sparse_moe.gate*'
      enable: false
    - quantizer_name: '*mixer.conv1d*'
      enable: false
    - quantizer_name: '*output_layer*'
      enable: false
    - quantizer_name: '*proj_out.*'
      enable: false
    - quantizer_name: 'output.*'
      enable: false
    # VLM siblings of language_model (visual tower + MTP head): not in the
    # decode path, must stay BF16. Belt-and-suspenders; the global
    # `*: enable: false` first rule already covers them.
    - quantizer_name: '*visual*'
      enable: false
    - quantizer_name: '*vision_tower*'
      enable: false
    - quantizer_name: '*mtp*'
      enable: false
    - parent_class: 'nn.BatchNorm1d'
      quantizer_name: '*'
      enable: false
    - parent_class: 'nn.BatchNorm2d'
      quantizer_name: '*'
      enable: false
    - parent_class: 'nn.BatchNorm3d'
      quantizer_name: '*'
      enable: false
    - parent_class: 'nn.LeakyReLU'
      quantizer_name: '*'
      enable: false
